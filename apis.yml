aid: aircube

name: AirCube

image: https://aircube.ai/opengraph-image

description: AirCube provides a unified API platform that gives developers access to over 450 AI models across image, video, audio, and text domains.
  Through a single REST endpoint and API key, users can generate media, synthesize speech, and run advanced model inference without managing multiple
  vendor integrations. The service offers free tier access, transparent usage‑based pricing, and enterprise features such as high‑availability
  scaling and dedicated support.

